    verified: true

# ---------------------------------------------------------------------
# 8. FINANCE – công thức (code dùng, A4 chỉ đọc kết quả)
# ---------------------------------------------------------------------
finance:
  fund_accumulation:
    description_vi: "Giá trị quỹ sau n năm, đóng đầu năm, trừ phí ban đầu, lãi kép hằng năm."
    formula: "fv = 0; for each year: fv = (fv + premium_annual * (1 - initial_charge)) * (1 + rate)"
    rate_source: "guaranteed_rate | illustrated_rate | scenarios_net_of_fund_fee"
  annuity_payout:
    description_vi: "Số tiền nhận đều hằng tháng trong n tháng từ giá trị quỹ."
    formula: "monthly = fv * r / (1 - (1 + r) ** -months), r = payout_rate / 12"
    default_months: 240
  bhxh_pension_rate:
    description_vi: "Tỷ lệ hưởng lương hưu theo số năm đóng (xem reg_pension_rate_female, reg_pension_rate_male)."
    female: "rate = min(75, 45 + 2 * (years - 15)) if years >= 15 else 0"
    male: "rate = 0 if years < 15 else (40 + (years - 15) if years < 20 else min(75, 45 + 2 * (years - 20)))"
    note_vi: "Lương hưu ≈ rate% × bình quân thu nhập làm căn cứ đóng (đã điều chỉnh). Luôn gọi là ước tính sơ bộ."
  pension_gap:
    formula: "missing_years = max(0, 15 - (bhxh_years + years_to_retirement_if_continue))"
    note_vi: "Nếu khách không đóng tiếp, missing_years = max(0, 15 - bhxh_years)."
  unemployment_gap:
    formula: "months_to_eligibility = max(0, 12 - bhtn_months)"
  installment_cover:
    formula: "cover = min(remaining_installments, benefit_max_periods) * min(installment, benefit_cap_per_period_vnd)"
  premium_to_income_ratio:
    formula: "ratio = monthly_premium / monthly_income"
  worked_examples:
    - name: "Vương – bị cắt giảm ở tháng 4"
      inputs: { installment_vnd: 1200000, remaining_installments_at_loss: 5, genz_months_paid: 2, premiums_paid_months: 4, monthly_premium_total_vnd: 94000 }
      outputs: { genz_benefit_vnd: 4000000, tragop_cover_vnd: 6000000, total_support_vnd: 10000000, premiums_paid_vnd: 376000, bhtn_benefit_vnd: 0 }
    - name: "Chị Mai – BHXH tự nguyện + Hưu Trí Linh Hoạt"
      inputs: { bhxh_years_total: 24, avg_income_basis_vnd: 4000000, premium_annual_vnd: 28800000, years: 16 }
      outputs: { pension_rate_pct: 63, bhxh_pension_vnd: 2520000, product_monthly_vnd: { guaranteed: 2710000, illustrated: 3390000 }, total_monthly_vnd: { low: 5230000, high: 5910000 } }
    - name: "Ông Đức – bà nhận được gì"
      inputs: { expected_pension_vnd: 10000000 }
      outputs: { baotin_death_benefit_vnd: 450000000, months_of_pension_equivalent: 45, tuky75_if_death_after_75_vnd: 0, baotin_cash_value_year1_vnd: 280000000 }

# ---------------------------------------------------------------------
# 9. GLOSSARY – thuật ngữ
# ---------------------------------------------------------------------
glossary:
  - { term: "Số tiền bảo hiểm", explain_vi: "Số tiền công ty bảo hiểm cam kết chi trả khi xảy ra sự kiện được bảo hiểm.", example_vi: "Hợp đồng có số tiền bảo hiểm 450 triệu thì người thụ hưởng nhận 450 triệu khi người được bảo hiểm mất." }
  - { term: "Phí bảo hiểm", explain_vi: "Số tiền khách phải đóng để hợp đồng có hiệu lực.", example_vi: "59.000đ mỗi tháng." }
  - { term: "Bên mua bảo hiểm", explain_vi: "Người ký hợp đồng và đóng phí.", example_vi: "Ông Đức mua bảo hiểm cho chính mình." }
  - { term: "Người được bảo hiểm", explain_vi: "Người mà sức khoẻ, tính mạng được bảo hiểm.", example_vi: "Ông Đức là người được bảo hiểm." }
  - { term: "Người thụ hưởng", explain_vi: "Người nhận tiền bảo hiểm khi sự kiện xảy ra.", example_vi: "Bà nhà được chỉ định là người thụ hưởng chính." }
  - { term: "Thời gian chờ", explain_vi: "Khoảng thời gian từ khi mua đến khi một quyền lợi bắt đầu được chi trả.", example_vi: "Thời gian chờ 90 ngày: mất việc trong 90 ngày đầu sẽ không được chi trả." }
  - { term: "Điều khoản loại trừ", explain_vi: "Các trường hợp công ty bảo hiểm không chi trả.", example_vi: "Tự nghỉ việc thường bị loại trừ trong bảo hiểm mất việc." }
  - { term: "Thời gian cân nhắc", explain_vi: "Khoảng thời gian sau khi nhận hợp đồng để khách đọc lại và có thể huỷ theo quy định.", example_vi: "Thường khoảng 21 ngày với hợp đồng nhân thọ." }
  - { term: "Giá trị hoàn lại", explain_vi: "Số tiền khách nhận lại nếu huỷ hợp đồng trước hạn.", example_vi: "Năm đầu có thể nhận lại khoảng 80% phí đã đóng." }
  - { term: "Đáo hạn", explain_vi: "Thời điểm hợp đồng kết thúc theo thời hạn; một số sản phẩm chi trả quyền lợi khi đáo hạn.", example_vi: "Hợp đồng hỗn hợp đáo hạn ở tuổi 80." }
  - { term: "Sản phẩm bổ trợ", explain_vi: "Quyền lợi mua thêm kèm hợp đồng chính.", example_vi: "Bổ trợ bệnh hiểm nghèo." }
  - { term: "Thẩm định sức khoẻ", explain_vi: "Quá trình công ty bảo hiểm đánh giá sức khoẻ để quyết định nhận bảo hiểm và mức phí.", example_vi: "Rút gọn (vài câu hỏi) hoặc đầy đủ (có thể phải khám)." }
  - { term: "Phụ phí", explain_vi: "Phần phí cộng thêm khi người được bảo hiểm có rủi ro sức khoẻ cao hơn chuẩn.", example_vi: "Cộng 15–25% phí nếu có tăng huyết áp." }
  - { term: "Bảo hiểm tử kỳ", explain_vi: "Chi trả nếu người được bảo hiểm mất trong thời hạn hợp đồng; hết hạn mà vẫn sống thì không nhận gì.", example_vi: "Tử kỳ đến 75 tuổi." }
  - { term: "Bảo hiểm trọn đời", explain_vi: "Bảo vệ đến rất cao tuổi (ví dụ 99), chắc chắn chi trả một khoản.", example_vi: "Dùng để để lại tài sản cho gia đình." }
  - { term: "Bảo hiểm hỗn hợp", explain_vi: "Vừa chi trả khi mất trong thời hạn, vừa chi trả khi sống đến đáo hạn.", example_vi: "Nhận số tiền bảo hiểm khi đến 80 tuổi." }
  - { term: "Bảo hiểm sinh kỳ", explain_vi: "Chi trả nếu người được bảo hiểm còn sống đến một thời điểm nhất định.", example_vi: "Nhận tiền khi đủ 60 tuổi." }
  - { term: "Bảo hiểm liên kết chung", explain_vi: "Bảo hiểm kèm tài khoản tích luỹ có lãi suất cam kết tối thiểu.", example_vi: "Lãi thực tế có thể cao hơn nhưng không thấp hơn mức cam kết." }
  - { term: "Bảo hiểm liên kết đơn vị", explain_vi: "Bảo hiểm kèm đầu tư vào quỹ; giá trị phụ thuộc thị trường, không cam kết.", example_vi: "Kịch bản 1,5% / 4,5% / 6,5% chỉ là minh hoạ." }
  - { term: "Lãi suất cam kết", explain_vi: "Mức lãi tối thiểu công ty bảo đảm trả.", example_vi: "Cam kết 2%/năm." }
  - { term: "Lãi suất minh hoạ", explain_vi: "Mức lãi giả định để minh hoạ, không phải cam kết.", example_vi: "Minh hoạ 4,5%/năm." }
  - { term: "Phí ban đầu", explain_vi: "Phần trăm phí bị khấu trừ trước khi đưa vào tài khoản tích luỹ.", example_vi: "Phí ban đầu 3% nghĩa là đóng 100 thì 97 vào quỹ." }
  - { term: "Phí quản lý quỹ", explain_vi: "Phí trừ hằng năm trên giá trị quỹ đầu tư.", example_vi: "1,5%/năm." }
  - { term: "Tạm dừng đóng phí", explain_vi: "Quyền ngưng đóng phí một thời gian mà hợp đồng vẫn duy trì theo điều kiện sản phẩm.", example_vi: "Tối đa 24 tháng từ năm thứ 2." }
  - { term: "Rút một phần", explain_vi: "Rút bớt tiền từ tài khoản tích luỹ khi hợp đồng còn hiệu lực.", example_vi: "Rút sau năm 5 không bị phạt." }
  - { term: "Thương tật toàn bộ vĩnh viễn (TTTBVV)", explain_vi: "Mất khả năng lao động vĩnh viễn ở mức nặng theo định nghĩa của hợp đồng.", example_vi: "Thường được chi trả như trường hợp tử vong." }
  - { term: "Đồng chi trả", explain_vi: "Phần chi phí y tế khách tự trả theo tỷ lệ.", example_vi: "Đồng chi trả 20%: hoá đơn 10 triệu thì khách trả 2 triệu." }
  - { term: "Bảo lãnh viện phí", explain_vi: "Công ty bảo hiểm thanh toán trực tiếp cho bệnh viện liên kết.", example_vi: "Khách không phải ứng tiền trước." }
  - { term: "Bệnh có sẵn", explain_vi: "Bệnh đã có trước khi mua bảo hiểm.", example_vi: "Thường phải chờ đến 1 năm mới được chi trả." }
  - { term: "BHXH bắt buộc", explain_vi: "Bảo hiểm xã hội người lao động có hợp đồng phải tham gia.", example_vi: "Chị Mai có 8 năm khi làm công nhân may." }
  - { term: "BHXH tự nguyện", explain_vi: "Bảo hiểm xã hội người không thuộc diện bắt buộc tự đóng để hưởng lương hưu.", example_vi: "Người kinh doanh tự do đóng tiếp để đủ 15 năm." }
  - { term: "BHXH một lần", explain_vi: "Nhận một khoản tiền thay cho việc tiếp tục tích luỹ thời gian đóng.", example_vi: "Rút rồi thì thời gian đóng tương ứng không còn được tính cho lương hưu." }
  - { term: "Bảo hiểm thất nghiệp (BHTN)", explain_vi: "Chế độ Nhà nước chi trả trợ cấp khi người lao động mất việc và đủ điều kiện.", example_vi: "Cần đủ 12 tháng đóng trong 24 tháng." }
  - { term: "Bảo hiểm y tế (BHYT)", explain_vi: "Chế độ Nhà nước chi trả một phần chi phí khám chữa bệnh.", example_vi: "Người hưởng lương hưu được cấp thẻ." }
  - { term: "Bảng minh hoạ quyền lợi", explain_vi: "Tài liệu công ty phát hành để minh hoạ quyền lợi theo từng năm cho một hồ sơ mẫu.", example_vi: "Dùng để lấy số liệu giá trị hoàn lại, giá trị quỹ." }
  - { term: "Quy tắc, điều khoản", explain_vi: "Tài liệu pháp lý quy định đầy đủ quyền lợi, loại trừ của sản phẩm.", example_vi: "Nguồn chính xác nhất để kiểm tra loại trừ." }
  - { term: "Bảo hiểm vi mô", explain_vi: "Bảo hiểm phí thấp dành cho người thu nhập thấp.", example_vi: "Phù hợp khi ngân sách rất hạn chế." }

# ---------------------------------------------------------------------
# 10. FAQ – câu hỏi thường gặp theo mảng
# ---------------------------------------------------------------------
faq:
  M1:
    - q: "Chưa đi làm thì mua bảo hiểm mất việc được không?"
      a: "Hầu hết quyền lợi mất việc yêu cầu đang có hợp đồng lao động, nên thời điểm hợp lý là ngay sau khi ký hợp đồng. Khi có hợp đồng từ 1 tháng trở lên, bạn cũng tự động tham gia BHTN của Nhà nước."
      refs: [reg_bhtn_participants]
    - q: "Bị cắt giảm sau vài tháng đi làm có được trợ cấp thất nghiệp không?"
      a: "BHTN của Nhà nước yêu cầu đã đóng đủ 12 tháng trong 24 tháng trước khi nghỉ, nên nếu mới đi làm vài tháng thì chưa được hưởng."
      refs: [reg_bhtn_conditions]
    - q: "Tự nghỉ việc có được chi trả không?"
      a: "Với BHTN của Nhà nước, trường hợp đơn phương chấm dứt hợp đồng trái pháp luật thì không được hưởng; nghỉ đúng quy định vẫn có thể được hưởng nếu đủ các điều kiện khác. Các gói thương mại trong catalog đều loại trừ trường hợp tự nghỉ."
      refs: [reg_bhtn_conditions]
    - q: "Bao lâu thì nhận được trợ cấp thất nghiệp?"
      a: "Thời điểm hưởng là ngày làm việc thứ 11 kể từ ngày nộp đủ hồ sơ."
      refs: [reg_bhtn_start]
  M2:
    - q: "Đã nghỉ đóng BHXH nhiều năm thì những năm cũ còn tính không?"
      a: "Nếu chưa rút BHXH một lần thì thời gian đã đóng vẫn được cộng dồn. Chỉ cần đủ 15 năm và đủ tuổi là được hưởng lương hưu hằng tháng."
      refs: [reg_pension_15y, reg_bhxh_lump_sum]
    - q: "BHXH tự nguyện khác bảo hiểm hưu trí của công ty bảo hiểm thế nào?"
      a: "BHXH tự nguyện là chế độ Nhà nước, cho lương hưu hằng tháng suốt đời kèm thẻ BHYT. Bảo hiểm hưu trí là sản phẩm thương mại, dùng để bổ sung thêm thu nhập, quyền lợi theo hợp đồng."
      refs: [reg_pension_15y, reg_pension_bhyt, reg_retirement_insurance_payout]
    - q: "Lãi suất minh hoạ có chắc chắn không?"
      a: "Không. Chỉ lãi suất cam kết tối thiểu là được bảo đảm; lãi minh hoạ là giả định."
      refs: []
    - q: "Sản phẩm liên kết đơn vị có rủi ro gì?"
      a: "Giá trị quỹ phụ thuộc kết quả đầu tư nên có thể thấp hơn kỳ vọng, và không có lãi cam kết. Khi tư vấn loại sản phẩm này, việc tư vấn phải được ghi âm theo quy định."
      refs: [reg_tt67_recording]
  M3:
    - q: "Bệnh huyết áp có bị từ chối bảo hiểm không?"
      a: "Tăng huyết áp đã kiểm soát tốt thường không bị từ chối ngay, nhưng mỗi công ty xử lý khác nhau: chấp nhận bình thường, cộng phụ phí hoặc yêu cầu khám. Quan trọng nhất là khai báo đúng."
      refs: []
    - q: "Tổng phí gần bằng số tiền bảo hiểm thì mua để làm gì?"
      a: "Ở tuổi cao, giá trị chính của bảo hiểm nhân thọ là một khoản tiền chắc chắn đến tay người thụ hưởng được chỉ định, không phải để sinh lời."
      refs: []
    - q: "Tử kỳ và trọn đời khác nhau thế nào?"
      a: "Tử kỳ chỉ chi trả nếu mất trong thời hạn, phí thấp. Trọn đời bảo vệ đến rất cao tuổi nên chắc chắn chi trả, phí cao hơn."
      refs: []
    - q: "Mua rồi đổi ý thì sao?"
      a: "Hợp đồng dài hạn thường có thời gian cân nhắc (khoảng 21 ngày) để đọc lại và có thể huỷ theo quy định. Nên kiểm tra trong quy tắc điều khoản."
      refs: [reg_free_look]
  M4:
    - q: "Đã có BHYT thì có cần bảo hiểm sức khoẻ không?"
      a: "BHYT chi trả theo phạm vi và mức hưởng quy định, vẫn có phần phải tự trả. Bảo hiểm sức khoẻ thương mại giúp giảm phần tự trả và có thể bảo lãnh viện phí."
      refs: []
    - q: "Vì sao phải chờ mới được chi trả?"
      a: "Thời gian chờ giúp tránh trường hợp mua khi đã biết mình sắp điều trị. Quy định giới hạn tối đa 90 ngày với bệnh thông thường, 1 năm với bệnh có sẵn."
      refs: [reg_tt67_waiting_caps]

# ---------------------------------------------------------------------
# 11. WRITING RULES – quy tắc bắt buộc cho A4 (và A3 khi trả lời)
# ---------------------------------------------------------------------
writing_rules:
  - "Chỉ dùng con số có trong file này hoặc do finance tính ra; số do finance tính phải gọi là ước tính."
  - "Sản phẩm is_fictional: true không được giới thiệu như sản phẩm có thật; giao diện luôn hiển thị nhãn dữ liệu minh hoạ."
  - "Quy định verified: false hoặc partial chỉ nói ở mức khái quát và khuyên khách kiểm tra với cơ quan BHXH hoặc tư vấn viên."
  - "Sản phẩm investment_linked: true phải nêu rõ không cam kết lãi và giá trị quỹ phụ thuộc thị trường."
  - "Luôn nêu điểm bất lợi (watch_outs) cùng với điểm mạnh (strengths); không hứa hẹn lợi nhuận."
  - "Lý do đề xuất phải gắn với thuộc tính hoặc câu nói cụ thể của khách."
  - "Xưng hô theo enums.address_styles; giữ giọng văn phù hợp với từng khách."
  - "Kết thúc tư vấn bằng lưu ý: thông tin chỉ mang tính tham khảo, nên làm việc với tư vấn viên có chứng chỉ trước khi mua."
  - "Không khẳng định một sản phẩm chắc chắn nhận hoặc từ chối khách có bệnh mãn tính; hướng dẫn khách khai báo trung thực."

# ---------------------------------------------------------------------
# 12. PROFILE SCHEMA – các trường thông tin về khách
#     level: core = cần cho Bước 1 với mọi khách
#            type = cần cho Bước 2 khi loại trong required_for đang dẫn đầu
#            optional = giúp cá nhân hoá, không chặn đề xuất
#            derived = code tự tính, không hỏi
#            inferred = Decision Agent (D2) suy ra từ câu trích, không hỏi trực tiếp
# ---------------------------------------------------------------------
profile_schema:
  conventions:
    confidence_min: 0.7
    money: "VND, lưu số nguyên hoặc {min, max}"
    extraction_rules_vi:
      - "Chỉ ghi điều khách nói rõ hoặc suy ra trực tiếp; mỗi trường kèm evidence là câu trích ngắn và turn_id."
      - "Chuẩn hoá tiền: '3tr' → 3000000; '1 tỷ 2' → 1200000000; '100-150k' → {min: 100000, max: 150000}; 'tầm 11tr' → 11000000."
      - "Khách phủ định một nỗi lo ('cái đó tôi không lo') thì ghi vào denied_concerns, không thêm vào primary_concerns."
      - "Khách sửa thông tin cũ thì ghi đè và giữ lịch sử."
      - "Không suy ra bệnh từ triệu chứng; chỉ ghi bệnh khách nói ra."
      - "Suy ra gender từ cách khách tự xưng nếu rõ ràng (chị, cô, bà → female; anh, chú, ông → male); không chắc thì để trống."
    one_of_groups:
      income: [monthly_income, income_stability]
      budget: [budget_monthly, budget_annual, budget_single]

  fields:
    # --- A. Cơ bản
    - { key: name, label_vi: "Tên", type: text, level: optional, topic: opening, feeds: [writer] }
    - { key: age, label_vi: "Tuổi", type: int, level: core, blocking: true, topic: basics, feeds: [D3, hard_filter, life_stage, address_style, finance], questions: [Q_AGE] }
    - { key: gender, label_vi: "Giới tính", type: "enum[male,female]", level: type, required_for: [retirement, life], topic: basics, infer_from: "cách tự xưng", feeds: [finance, sample_premium], questions: [Q_GENDER] }
    - { key: location, label_vi: "Nơi sống", type: text, level: optional, topic: basics, feeds: [writer] }
    - { key: marital_status, label_vi: "Tình trạng hôn nhân", type: "enum[single,married,widowed,divorced]", level: optional, topic: dependents_family, feeds: [D3], questions: [Q_FAMILY] }
    # --- B. Công việc và thu nhập
    - { key: employment_status, label_vi: "Tình trạng việc làm", type: "enum:employment_status", level: core, blocking: true, topic: job_income, feeds: [D3, hard_filter, D1], questions: [Q_JOB] }
    - { key: occupation, label_vi: "Công việc", type: text, level: optional, topic: job_income, feeds: [writer], questions: [Q_JOB] }
    - { key: job_prospect, label_vi: "Triển vọng việc làm", type: text, level: type, required_for: [unemployment], ask_if: "employment_status in ['job_seeking','student']", topic: job_income, feeds: [D3, writer], questions: [Q_JOB_PROSPECT] }
    - { key: expected_income, label_vi: "Thu nhập dự kiến", type: money, level: optional, topic: job_income, feeds: [premium_to_income_ratio], questions: [Q_JOB_PROSPECT] }
    - { key: has_employment_contract, label_vi: "Có HĐLĐ", type: bool, level: type, required_for: [unemployment], topic: job_income, feeds: [hard_filter], questions: [Q_CONTRACT, Q_BHXH] }
    - { key: months_in_current_job, label_vi: "Số tháng làm công việc hiện tại", type: int, level: optional, topic: job_income, feeds: [D3], questions: [Q_CONTRACT] }
    - { key: monthly_income, label_vi: "Thu nhập hằng tháng", type: money, level: core, group: income, topic: job_income, feeds: [premium_to_income_ratio, weights], questions: [Q_JOB, Q_CURRENT_SUPPORT] }
    - { key: income_sources, label_vi: "Nguồn thu nhập", type: list, level: optional, topic: job_income, feeds: [writer], questions: [Q_CURRENT_SUPPORT] }
    - { key: income_stability, label_vi: "Mức ổn định thu nhập", type: "enum:income_stability", level: core, group: income, topic: job_income, feeds: [D3, weights], questions: [Q_INCOME_STABILITY, Q_CURRENT_SUPPORT] }
    - { key: retirement_timing, label_vi: "Thời điểm nghỉ hưu", type: text, level: optional, ask_if: "age >= 55", topic: social_insurance, feeds: [years_to_retirement], questions: [Q_RETIRE] }
    - { key: expected_pension, label_vi: "Lương hưu dự kiến", type: money, level: type, required_for: [life], ask_if: "employment_status in ['near_retirement','retired'] or (age is not None and age >= 55)", topic: social_insurance, feeds: [D3, finance], questions: [Q_RETIRE] }
    # --- C. Gia đình
    - { key: dependents, label_vi: "Người phụ thuộc", type: "list[{relation, age, financially_dependent}]", level: core, topic: dependents_family, feeds: [D3, D6], questions: [Q_FAMILY] }
    - { key: spouse_income, label_vi: "Thu nhập/lương hưu của vợ hoặc chồng", type: money, level: optional, ask_if: "marital_status == 'married' and top_type in ['life','retirement']", topic: dependents_family, feeds: [D6], questions: [Q_SPOUSE] }
    # --- D. Tài chính
    - { key: monthly_expenses, label_vi: "Chi tiêu hằng tháng", type: money, level: optional, topic: debts_expenses, feeds: [insight, finance], questions: [Q_EXPENSES, Q_CURRENT_SUPPORT] }
    - { key: savings, label_vi: "Tiết kiệm", type: "{amount, earmark}", level: type, required_for: [life], topic: debts_expenses, feeds: [D3, affordability], questions: [Q_SAVINGS] }
    - { key: assets, label_vi: "Tài sản", type: list, level: optional, topic: debts_expenses, feeds: [writer], questions: [Q_SAVINGS] }
    - { key: debts, label_vi: "Khoản nợ / trả góp", type: "list[{type, monthly, remaining_months}]", level: type, required_for: [unemployment], topic: debts_expenses, feeds: [D3, hard_filter, finance], questions: [Q_DEBT] }
    - { key: upcoming_expenses, label_vi: "Khoản chi lớn sắp tới", type: list, level: type, required_for: [retirement], topic: debts_expenses, feeds: [D2.need_flexibility, D6, weights], questions: [Q_UPCOMING] }
    # --- E. An sinh và bảo hiểm hiện có
    - { key: bhxh_years, label_vi: "Số năm đã đóng BHXH", type: number, level: type, required_for: [retirement], topic: social_insurance, feeds: [D3, pension_gap, finance], questions: [Q_BHXH] }
    - { key: bhxh_withdrawn, label_vi: "Đã rút BHXH một lần", type: bool, level: type, required_for: [retirement], ask_if: "bhxh_years is not None and bhxh_years > 0", topic: social_insurance, feeds: [pension_gap], questions: [Q_BHXH_WITHDRAWN] }
    - { key: bhtn_months, label_vi: "Số tháng đã đóng BHTN", type: int, level: type, required_for: [unemployment], topic: social_insurance, feeds: [D3, unemployment_gap], questions: [Q_BHXH] }
    - { key: existing_insurance, label_vi: "Bảo hiểm đang có", type: list, level: type, required_for: [life, health], topic: existing_coverage, feeds: [D3, writer], questions: [Q_EXISTING] }
    # --- F. Sức khoẻ (tự khai, nhạy cảm)
    - { key: health_status, label_vi: "Tình trạng sức khoẻ", type: "enum[good,fair,poor]", level: type, required_for: [life, health], sensitive: true, topic: health, feeds: [D3, hard_filter], questions: [Q_HEALTH, Q_HEALTH_LIGHT] }
    - { key: chronic_conditions, label_vi: "Bệnh mãn tính", type: list, level: type, required_for: [life, health], sensitive: true, topic: health, feeds: [D3, D5, weights, hard_filter], questions: [Q_HEALTH] }
    - { key: condition_controlled, label_vi: "Bệnh đã được kiểm soát", type: bool, level: optional, sensitive: true, ask_if: "chronic_conditions", topic: health, feeds: [D5], questions: [Q_CONDITION_CONTROL] }
    - { key: smoker, label_vi: "Hút thuốc", type: bool, level: type, required_for: [life], sensitive: true, topic: health, feeds: [sample_premium], questions: [Q_HEALTH] }
    # --- G. Nhu cầu và thái độ
    - { key: primary_concerns, label_vi: "Nỗi lo chính", type: "list[enum:concerns]", level: core, blocking: true, topic: goals_concerns, feeds: [D3, D5, writer], questions: [Q_OPEN, Q_CONCERN] }
    - { key: denied_concerns, label_vi: "Điều khách nói là không lo", type: "list[enum:concerns]", level: optional, topic: goals_concerns, feeds: [D3], questions: [Q_DISAMBIG] }
    - { key: goals, label_vi: "Mong muốn", type: text, level: optional, topic: goals_concerns, feeds: [writer], questions: [Q_GOAL] }
    - { key: risk_tolerance, label_vi: "Khẩu vị rủi ro", type: "enum:attitude_levels.risk_tolerance", level: inferred, required_for: [retirement], topic: risk_attitude, feeds: [weights], questions: [Q_RISK] }
    - { key: need_flexibility, label_vi: "Nhu cầu linh hoạt", type: "enum:attitude_levels.need_flexibility", level: inferred, topic: debts_expenses, feeds: [weights], questions: [Q_UPCOMING] }
    - { key: trust_concern, label_vi: "Lo ngại việc chi trả", type: "enum:attitude_levels.trust_concern", level: inferred, topic: goals_concerns, feeds: [weights], questions: [] }
    - { key: budget_monthly, label_vi: "Ngân sách hằng tháng", type: money, level: core, group: budget, topic: budget_payment, feeds: [hard_filter, weights], questions: [Q_BUDGET] }
    - { key: budget_annual, label_vi: "Ngân sách hằng năm", type: money, level: core, group: budget, topic: budget_payment, feeds: [hard_filter], questions: [Q_BUDGET_LIFE] }
    - { key: budget_single, label_vi: "Ngân sách đóng một lần", type: money, level: core, group: budget, topic: budget_payment, feeds: [hard_filter], questions: [Q_BUDGET_LIFE] }
    - { key: payment_preference, label_vi: "Cách đóng phí mong muốn", type: "enum[monthly,annual,single]", level: type, required_for: [life], topic: budget_payment, feeds: [hard_filter, D5], questions: [Q_BUDGET_LIFE] }
    - { key: beneficiaries, label_vi: "Người thụ hưởng mong muốn", type: list, level: type, required_for: [life], topic: beneficiaries, feeds: [writer], questions: [Q_BENEFICIARY] }

  derived_fields:
    - { key: life_stage, from: [age], rule: "enums.life_stage" }
    - { key: address_style, from: [age, cách tự xưng], rule: "enums.address_styles" }
    - { key: years_to_retirement, from: [age, gender, retirement_timing], rule: "regulations.reg_retirement_age; ưu tiên retirement_timing nếu khách nói rõ" }
    - { key: pension_gap, from: [bhxh_years, bhxh_withdrawn, age, gender], rule: "finance.pension_gap" }
    - { key: unemployment_gap_months, from: [bhtn_months], rule: "finance.unemployment_gap" }
    - { key: premium_to_income_ratio, from: [budget_monthly, monthly_income, expected_income], rule: "finance.premium_to_income_ratio" }
    - { key: has_large_expense_2y, from: [upcoming_expenses], rule: "upcoming_expenses không rỗng hoặc Decision Agent D6.large_expense_2y > 0.7" }
    - { key: has_chronic_condition, from: [chronic_conditions], rule: "len(chronic_conditions) > 0" }
    - { key: completeness, from: ["*"], rule: "readiness.step1 và readiness.step2" }

  readiness:
    step1_recommend_type:
      blocking: [age, employment_status, primary_concerns]
      core: [age, employment_status, "one_of:income", dependents, primary_concerns, "one_of:budget"]
      completeness_formula: "số trường đã có (core + type của loại đang dẫn đầu) / tổng số trường đó; trường thuộc one_of chỉ cần 1 trong nhóm"
      rule_vi: "Đủ mọi trường blocking VÀ (độ đầy đủ ≥ 0,85 HOẶC Decision Agent D1 chọn ready_to_recommend) HOẶC đã hỏi 8 câu."
    step2_compare_products:
      unemployment: [age, employment_status, has_employment_contract, bhtn_months, debts, "one_of:budget"]
      retirement: [age, gender, bhxh_years, bhxh_withdrawn, risk_tolerance, upcoming_expenses, "one_of:budget"]
      life: [age, gender, chronic_conditions, smoker, existing_insurance, beneficiaries, payment_preference, "one_of:budget"]
      health: [age, chronic_conditions, existing_insurance, "one_of:budget"]
      rule_vi: "Trường nào còn thiếu thì sản phẩm phụ thuộc trường đó được gắn nhãn «cần xác nhận» thay vì bị loại, và A4 nêu rõ giả định."
    defaults_when_missing:
      gender: { value: null, note_vi: "Dùng phí mẫu chung, nói rõ phí thực tế phụ thuộc giới tính" }
      smoker: { value: false, note_vi: "Giả định không hút thuốc khi dùng phí mẫu, phải nói rõ giả định" }
      risk_tolerance: { value: "Low", note_vi: "Mặc định thận trọng" }
      upcoming_expenses: { value: [], note_vi: "Không cộng trọng số linh hoạt" }
      bhxh_withdrawn: { value: null, note_vi: "Nêu cả hai trường hợp: đã rút và chưa rút" }

# ---------------------------------------------------------------------
# 13. QUESTION BANK – bộ câu hỏi định sẵn
#     Placeholder: {bot} cách LUMI tự xưng; {Bot} viết hoa đầu câu;
#                  {kh} cách gọi khách; {Kh} viết hoa đầu câu; {a} = "ạ" với mid/senior, "" với young
# ---------------------------------------------------------------------
question_bank:
  rules:
    max_questions: 8
    max_targets_per_message: 2
    max_words_per_message: 45
    selection_flow_vi:
      - "1. Còn thiếu trường blocking (age, employment_status, primary_concerns) → hỏi ngay câu tương ứng, không cần Decision Agent."
      - "2. Nếu không, Decision Agent D1 chọn topic."
      - "3. Trong topic đó, chọn câu đầu tiên có ask_if đúng và còn target chưa có; câu follow_up vừa được kích hoạt được ưu tiên."
      - "4. Có thể ghép thêm 1 câu (cùng topic hoặc topic kế tiếp theo fallback_order) nếu tổng target không vượt max_targets_per_message."
      - "5. A3 viết lại câu theo address_style và ngữ cảnh; nếu A3 lỗi hoặc đang ở chế độ offline thì dùng nguyên template."
      - "6. Nếu Decision Agent D3 có độ tin cậy dưới ngưỡng ở Bước 1 → dùng câu trong disambiguation theo cặp loại dẫn đầu."
    composition_vi:
      - "Không hỏi lại trường đã có với độ tin cậy ≥ 0,7."
      - "Nếu khách vừa bày tỏ lo lắng, mở đầu bằng một câu đồng cảm ngắn."
      - "Câu hỏi có sensitive: true phải kèm lý do hỏi (why_ask_vi)."
      - "Có thể nhắc lại chi tiết khách vừa nói để câu hỏi tự nhiên hơn."
      - "Trong giai đoạn DISCOVERY không nhắc tên sản phẩm hay loại bảo hiểm cụ thể."
      - "A3 được đổi cách diễn đạt, nhưng không được bỏ target hay thêm target ngoài danh sách."
    address_fill:
      young:  { bot: "mình", Bot: "Mình", kh: "bạn", Kh: "Bạn", a: "" }
      mid:    { bot: "em", Bot: "Em", kh: "anh/chị", Kh: "Anh/chị", a: " ạ" }
      senior: { bot: "cháu", Bot: "Cháu", kh: "bác", Kh: "Bác", a: " ạ" }
      note_vi: "Khi đã biết tên hoặc giới tính, thay kh bằng tên (young) hoặc anh/chị, bác trai/bác gái cho đúng."

  opening:
    id: Q_OPEN
    targets: [primary_concerns, name, age]
    template: "Xin chào! Tôi là LUMI, trợ lý tư vấn bảo hiểm. Tôi sẽ hỏi một vài câu để hiểu hoàn cảnh của bạn, sau đó gợi ý loại bảo hiểm phù hợp. Thông tin chỉ dùng cho buổi tư vấn này. Bạn đang quan tâm hoặc lo lắng điều gì?"
    note_vi: "Giống nhau cho mọi khách; xưng hô chỉ đổi từ câu thứ 2."

  questions:
    # --- basics
    - id: Q_AGE
      topic: basics
      targets: [age]
      ask_if: "age is None"
      template: "Cho {bot} hỏi {kh} năm nay bao nhiêu tuổi{a}?"
    - id: Q_GENDER
      topic: basics
      targets: [gender]
      ask_if: "gender is None and top_type in ['retirement','life']"
      priority: low
      why_ask_vi: "Tuổi nghỉ hưu và phí bảo hiểm khác nhau giữa nam và nữ."
      template: "Để tính tuổi nghỉ hưu và phí cho chính xác, {bot} xin phép hỏi {kh} là nam hay nữ{a}?"
    # --- goals_concerns
    - id: Q_CONCERN
      topic: goals_concerns
      targets: [primary_concerns]
      ask_if: "not primary_concerns"
      template: "Điều {kh} lo lắng nhất về tài chính lúc này là gì{a}?"
    - id: Q_GOAL
      topic: goals_concerns
      targets: [goals]
      ask_if: "primary_concerns and not goals"
      template: "Nếu chuyện đó xảy ra, {kh} mong bảo hiểm giúp được điều gì nhất{a}?"
      variants:
        young: "Điều {kh} muốn được bảo vệ nhất là gì?"
    # --- job_income
    - id: Q_JOB
      topic: job_income
      targets: [employment_status, monthly_income]
      ask_if: "employment_status is None"
      template: "{Kh} đang làm công việc gì, và thu nhập hằng tháng khoảng bao nhiêu{a}?"
      example: { answer: "Chị bán quần áo, có một cửa hàng nhỏ... tháng nào đều thì được 20 triệu", extract: { employment_status: self_employed, occupation: "bán quần áo", monthly_income: 20000000 } }
    - id: Q_JOB_PROSPECT
      topic: job_income
      targets: [job_prospect, expected_income]
      ask_if: "employment_status in ['job_seeking','student'] and job_prospect is None"
      template: "{Kh} đang tìm việc ngành gì, và đã có cơ hội nào triển vọng chưa{a}?"
      example: { answer: "có 1 startup fintech hẹn phỏng vấn vòng cuối tuần sau, lương tầm 11tr", extract: { job_prospect: "phỏng vấn vòng cuối, startup fintech", expected_income: 11000000 } }
    - id: Q_CURRENT_SUPPORT
      topic: job_income
      targets: [income_sources, income_stability]
      ask_if: "employment_status in ['job_seeking','student'] and income_stability is None"
      template: "Hiện giờ {kh} đang trang trải chi phí sinh hoạt bằng nguồn nào{a}?"
      example: { answer: "bố mẹ gửi cho 3tr/tháng, mình nhận thêm job freelance, tháng nhiều thì 4tr, tháng ít thì chẳng có đồng nào", extract: { income_sources: ["gia đình 3tr", "freelance 0–4tr"], income_stability: low } }
    - id: Q_INCOME_STABILITY
      topic: job_income
      targets: [income_stability]
      ask_if: "monthly_income is not None and income_stability is None"
      template: "Thu nhập này có đều đặn hằng tháng không, hay lúc nhiều lúc ít{a}?"
    - id: Q_CONTRACT
      topic: job_income
      targets: [has_employment_contract, months_in_current_job]
      ask_if: "employment_status in ['employed','probation'] and top_type == 'unemployment'"
      template: "{Kh} làm ở chỗ hiện tại được bao lâu rồi, và có hợp đồng lao động không{a}?"
    # --- dependents_family
    - id: Q_FAMILY
      topic: dependents_family
      targets: [dependents, marital_status]
      ask_if: "dependents is None"
      template: "Hiện có ai đang phụ thuộc vào thu nhập của {kh} không, như vợ/chồng, con nhỏ hay bố mẹ{a}?"
      variants:
        senior: "Gia đình mình hiện thế nào{a}? Có ai đang trông vào thu nhập của {kh} không{a}?"
        mid: "{Kh} cho em hỏi về gia đình: mình có mấy cháu, và có ai đang trông vào thu nhập của {kh} không{a}?"
    - id: Q_SPOUSE
      topic: dependents_family
      targets: [spouse_income]
      ask_if: "marital_status == 'married' and spouse_income is None and top_type in ['life','retirement']"
      template: "Vợ hoặc chồng của {kh} có thu nhập hay lương hưu riêng không{a}?"
      variants:
        mid: "Anh/chị nhà có thu nhập hay đóng bảo hiểm gì không{a}?"
        senior: "Bác trai/bác gái nhà mình có thu nhập hay lương hưu riêng không{a}?"
    # --- debts_expenses
    - id: Q_DEBT
      topic: debts_expenses
      targets: [debts]
      ask_if: "debts is None and (top_type == 'unemployment' or life_stage in ['young_adult','early_career'])"
      template: "{Kh} có khoản vay hay trả góp nào phải trả hằng tháng không{a}?"
      example: { answer: "có trả góp cái laptop 1tr2/tháng, còn 10 tháng nữa", extract: { debts: [{ type: "trả góp laptop", monthly: 1200000, remaining_months: 10 }] } }
    - id: Q_EXPENSES
      topic: debts_expenses
      targets: [monthly_expenses]
      ask_if: "monthly_expenses is None"
      priority: low
      template: "Chi tiêu hằng tháng của {kh} (hoặc cả nhà) khoảng bao nhiêu{a}?"
    - id: Q_UPCOMING
      topic: debts_expenses
      targets: [upcoming_expenses]
      ask_if: "upcoming_expenses is None and top_type == 'retirement'"
      template: "Trong 1–2 năm tới, {kh} có khoản chi lớn nào đã tính trước không, như con vào đại học, sửa nhà hay cưới hỏi{a}?"
      example: { answer: "năm sau đứa lớn vào đại học, có khi có tháng chị phải bớt lại", extract: { upcoming_expenses: ["con vào đại học năm sau"] }, decision_d2: { need_flexibility: High } }
    - id: Q_SAVINGS
      topic: debts_expenses
      targets: [savings, assets]
      ask_if: "savings is None and top_type in ['life','retirement']"
      template: "{Kh} đã có khoản tiết kiệm nào chưa, và khoản đó đang dành cho việc gì{a}?"
    # --- social_insurance
    - id: Q_BHXH
      topic: social_insurance
      targets: [bhxh_years, bhtn_months]
      ask_if: "bhxh_years is None"
      template: "{Kh} đã từng đi làm có hợp đồng và đóng bảo hiểm xã hội chưa, được khoảng bao lâu{a}?"
    - id: Q_BHXH_WITHDRAWN
      topic: social_insurance
      targets: [bhxh_withdrawn]
      ask_if: "bhxh_years is not None and bhxh_years > 0 and bhxh_withdrawn is None and employment_status != 'employed'"
      why_ask_vi: "Nếu chưa rút, thời gian đã đóng vẫn được cộng dồn để tính lương hưu."
      template: "{Bot} hỏi thêm một điều khá quan trọng: khoảng thời gian đóng bảo hiểm xã hội đó {kh} đã rút một lần chưa{a}?"
      example: { answer: "Chưa em, chị vẫn để đấy, cũng không biết để làm gì.", extract: { bhxh_withdrawn: false } }
    - id: Q_RETIRE
      topic: social_insurance
      targets: [retirement_timing, expected_pension]
      ask_if: "age is not None and age >= 55 and expected_pension is None"
      template: "{Kh} dự kiến nghỉ hưu khi nào, và lương hưu khoảng bao nhiêu{a}?"
    # --- health (nhạy cảm)
    - id: Q_HEALTH
      topic: health
      targets: [chronic_conditions, smoker]
      ask_if: "chronic_conditions is None and (top_type in ['life','health'] or (age is not None and age >= 45))"
      sensitive: true
      why_ask_vi: "Công ty bảo hiểm sẽ yêu cầu khai báo sức khoẻ; khai đúng thì sau này mới chắc chắn được chi trả."
      template: "{Bot} cần hỏi về sức khoẻ vì công ty bảo hiểm sẽ yêu cầu khai báo, khai đúng thì sau này mới chắc chắn được chi trả. {Kh} có bệnh gì cần theo dõi thường xuyên không, và có hút thuốc không{a}?"
      example: { answer: "Tôi bị huyết áp cao, uống thuốc đều 5 năm nay, đo lần nào cũng ổn. Thuốc lá thì bỏ được 10 năm rồi.", extract: { chronic_conditions: ["tăng huyết áp"], condition_controlled: true, smoker: false, health_status: fair } }
    - id: Q_HEALTH_LIGHT
      topic: health
      targets: [health_status]
      ask_if: "health_status is None and top_type in ['unemployment','retirement']"
      priority: low
      template: "Sức khoẻ của {kh} hiện thế nào{a}?"
    - id: Q_CONDITION_CONTROL
      topic: health
      targets: [condition_controlled]
      ask_if: "chronic_conditions and condition_controlled is None"
      sensitive: true
      why_ask_vi: "Bệnh đã kiểm soát ổn định thì khả năng được nhận bảo hiểm cao hơn."
      template: "Tình trạng đó hiện đã được kiểm soát ổn định chưa{a}?"
    # --- risk_attitude
    - id: Q_RISK
      topic: risk_attitude
      targets: [risk_tolerance]
      ask_if: "top_type == 'retirement' and risk_tolerance is None"
      template: "Khi tích luỹ cho tương lai, {kh} thích kiểu an toàn, được cam kết, hay chấp nhận rủi ro để có thể lãi nhiều hơn{a}?"
      note_vi: "Câu trả lời được gửi cho Decision Agent D2 để chấm risk_tolerance; A1 chỉ lưu câu trích."
      example: { answer: "Rủi ro thì chị sợ lắm, chị từng mất tiền vì chơi hụi rồi.", decision_d2: { risk_tolerance: "Very low" } }
    # --- existing_coverage
    - id: Q_EXISTING
      topic: existing_coverage
      targets: [existing_insurance]
      ask_if: "existing_insurance is None and top_type in ['life','health','retirement']"
      template: "{Kh} đã có hợp đồng bảo hiểm nào chưa, ngoài bảo hiểm y tế{a}?"
    # --- beneficiaries
    - id: Q_BENEFICIARY
      topic: beneficiaries
      targets: [beneficiaries]
      ask_if: "top_type == 'life' and not beneficiaries"
      template: "Nếu có một khoản tiền bảo hiểm, {kh} muốn ai là người nhận{a}?"
    # --- budget_payment
    - id: Q_BUDGET
      topic: budget_payment
      targets: [budget_monthly]
      ask_if: "top_type != 'life' and budget_monthly is None"
      template: "Mỗi tháng {kh} có thể dành khoảng bao nhiêu cho việc này mà không bị áp lực{a}?"
      example: { answer: "chắc 100-150k thôi", extract: { budget_monthly: { min: 100000, max: 150000 } } }
    - id: Q_BUDGET_LIFE
      topic: budget_payment
      targets: [payment_preference, budget_single]
      ask_if: "top_type == 'life' and payment_preference is None"
      template: "{Kh} dự định đóng dần hằng năm hay đóng một lần, và khoảng bao nhiêu thì thoải mái{a}?"
      example: { answer: "Tôi có thể trích ra 300 đến 400 triệu, hoặc mỗi năm đóng khoảng 50 triệu trong 10 năm", extract: { budget_single: { min: 300000000, max: 400000000 }, budget_annual: 50000000, payment_preference: null } }

  follow_ups:
    - { when: "employment_status in ['job_seeking','student']", ask: [Q_JOB_PROSPECT, Q_CURRENT_SUPPORT] }
    - { when: "monthly_income is not None and income_stability is None", ask: [Q_INCOME_STABILITY] }
    - { when: "bhxh_years is not None and bhxh_years > 0 and employment_status != 'employed'", ask: [Q_BHXH_WITHDRAWN] }
    - { when: "marital_status == 'married' and top_type in ['life','retirement']", ask: [Q_SPOUSE] }
    - { when: "'spouse_protection' in primary_concerns or 'legacy' in primary_concerns", ask: [Q_BENEFICIARY] }
    - { when: "chronic_conditions", ask: [Q_CONDITION_CONTROL] }

  topic_questions:
    basics: [Q_AGE, Q_GENDER]
    goals_concerns: [Q_CONCERN, Q_GOAL]
    job_income: [Q_JOB, Q_JOB_PROSPECT, Q_CURRENT_SUPPORT, Q_INCOME_STABILITY, Q_CONTRACT]
    dependents_family: [Q_FAMILY, Q_SPOUSE]
    debts_expenses: [Q_DEBT, Q_UPCOMING, Q_SAVINGS, Q_EXPENSES]
    social_insurance: [Q_BHXH, Q_BHXH_WITHDRAWN, Q_RETIRE]
    health: [Q_HEALTH, Q_CONDITION_CONTROL, Q_HEALTH_LIGHT]
    risk_attitude: [Q_RISK]
    existing_coverage: [Q_EXISTING]
    beneficiaries: [Q_BENEFICIARY]
    budget_payment: [Q_BUDGET, Q_BUDGET_LIFE]

  disambiguation:
    id: Q_DISAMBIG
    use_when_vi: "Decision Agent D3 có độ tin cậy dưới 0,6 ở thời điểm đề xuất; chọn câu theo cặp 2 loại có xác suất cao nhất."
    targets: [primary_concerns, denied_concerns]
    by_pair:
      "unemployment|health": "Lúc này {kh} lo hơn về việc mất thu nhập khi mất việc, hay chi phí khi ốm đau{a}?"
      "unemployment|retirement": "Lúc này {kh} lo về thu nhập trước mắt hay thu nhập khi về già hơn{a}?"
      "unemployment|life": "{Kh} lo cho thu nhập của chính mình khi mất việc, hay lo cho gia đình nếu mình không may{a}?"
      "retirement|life": "{Kh} muốn ưu tiên có thu nhập cho chính mình khi về già, hay một khoản để lại cho gia đình nếu mình không may{a}?"
      "retirement|health": "Khi về già, {kh} lo nhất là không có thu nhập đều đặn hay chi phí chữa bệnh{a}?"
      "life|health": "Còn chi phí khám chữa bệnh thì {kh} có lo không, hay điều {kh} lo nhất là cuộc sống của gia đình nếu mình không còn{a}?"
    example: { answer: "Có bảo hiểm y tế với tiền tiết kiệm rồi, cái đó tôi không lo lắm. Cái tôi lo là bà nhà tôi.", extract: { denied_concerns: [medical_cost], primary_concerns: [spouse_protection] } }
