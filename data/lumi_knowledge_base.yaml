# ---------------------------------------------------------------------
# 7. REGULATIONS – tri thức quy định
#    verified: true = đã đối chiếu nguồn ghi kèm; partial / false = chỉ nói khái quát
# ---------------------------------------------------------------------
regulations:
  - id: reg_insurance_categories
    topic: "Loại hình bảo hiểm"
    segment: all
    content_vi: "Luật Kinh doanh bảo hiểm 2022 chia thành 3 loại hình: bảo hiểm nhân thọ, bảo hiểm sức khoẻ, bảo hiểm phi nhân thọ. Nghiệp vụ chi tiết do Chính phủ quy định (Nghị định 46/2023/NĐ-CP); nhân thọ gồm trọn đời, sinh kỳ, tử kỳ, hỗn hợp, cùng các nghiệp vụ liên kết đầu tư và hưu trí; phi nhân thọ có nghiệp vụ tín dụng và rủi ro tài chính."
    legal_basis: "Luật 08/2022/QH15; Nghị định 46/2023/NĐ-CP"
    source_url: "https://xaydungchinhsach.chinhphu.vn/toan-van-luat-kinh-doanh-bao-hiem-119240130070753445.htm"
    verified: true
  - id: reg_bhtn_participants
    topic: "Đối tượng tham gia BHTN"
    segment: M1
    content_vi: "Từ 1/1/2026, người lao động có hợp đồng lao động xác định thời hạn từ 1 tháng trở lên thuộc đối tượng phải tham gia BHTN."
    legal_basis: "Luật Việc làm 2025, khoản 1 Điều 31"
    effective_from: "2026-01-01"
    source_url: "https://hatinh.gov.vn/vi/bai-viet/tu-nam-2026-nguoi-lao-dong-se-duoc-tang-muc-huong-tro-cap-that-nghiep"
    verified: true
  - id: reg_bhtn_conditions
    topic: "Điều kiện hưởng trợ cấp thất nghiệp"
    segment: M1
    content_vi: "Chấm dứt HĐ theo quy định (không phải đơn phương chấm dứt trái pháp luật, không phải nghỉ việc khi đủ điều kiện hưởng lương hưu) và đã đóng BHTN đủ 12 tháng trở lên trong 24 tháng trước khi chấm dứt HĐ; cùng các điều kiện khác theo Điều 38."
    legal_basis: "Luật Việc làm 2025, Điều 38"
    effective_from: "2026-01-01"
    source_url: "https://baochinhphu.vn/bon-dieu-kien-huong-tro-cap-that-nghiep-tu-2026-102260116155112955.htm"
    verified: true
  - id: reg_bhtn_amount
    topic: "Mức hưởng trợ cấp thất nghiệp"
    segment: M1
    content_vi: "Mức hưởng hằng tháng bằng 60% bình quân tiền lương tháng đóng BHTN của 6 tháng liền kề trước khi thất nghiệp, tối đa không quá 5 lần mức lương tối thiểu vùng."
    legal_basis: "Luật Việc làm 2025, khoản 1 Điều 39"
    effective_from: "2026-01-01"
    source_url: "https://xaydungchinhsach.chinhphu.vn/nhung-thay-doi-quan-trong-ve-cac-che-do-huong-bao-hiem-that-nghiep-tu-1-1-2026-119251205095855316.htm"
    verified: true
  - id: reg_bhtn_start
    topic: "Thời điểm hưởng trợ cấp thất nghiệp"
    segment: M1
    content_vi: "Thời điểm hưởng trợ cấp thất nghiệp là ngày làm việc thứ 11 kể từ ngày nộp đủ hồ sơ."
    legal_basis: "Luật Việc làm 2025"
    source_url: "https://vneconomy.vn/thay-doi-dieu-kien-huong-tro-cap-that-nghiep-tu-1-1-2026.htm"
    verified: true
  - id: reg_bhtn_duration
    topic: "Thời gian hưởng trợ cấp thất nghiệp"
    segment: M1
    content_vi: "Thời gian hưởng tính theo số tháng đã đóng BHTN. Chi tiết cần tra cứu Nghị định 374/2025/NĐ-CP."
    legal_basis: "Luật Việc làm 2025; Nghị định 374/2025/NĐ-CP"
    source_url: "https://baohiemxahoi.gov.vn/tintuc/Pages/linh-vuc-bao-hiem-xa-hoi.aspx?ItemID=26068&CateID=168"
    verified: false
  - id: reg_pension_15y
    topic: "Số năm đóng BHXH tối thiểu để hưởng lương hưu"
    segment: M2
    content_vi: "Từ 1/7/2025, người lao động đủ tuổi nghỉ hưu và có từ đủ 15 năm đóng BHXH trở lên được hưởng lương hưu hằng tháng (giảm từ 20 năm), áp dụng cả với BHXH tự nguyện."
    legal_basis: "Luật BHXH 2024 (41/2024/QH15), Điều 64, 98"
    effective_from: "2025-07-01"
    source_url: "https://baohiemxahoi.gov.vn/tintuc/Pages/linh-vuc-bao-hiem-xa-hoi.aspx?CateID=168&ItemID=23692"
    verified: true
  - id: reg_pension_rate_female
    topic: "Tỷ lệ hưởng lương hưu – lao động nữ"
    segment: M2
    content_vi: "45% mức bình quân thu nhập làm căn cứ đóng BHXH ứng với 15 năm đóng; mỗi năm đóng thêm cộng 2%; tối đa 75%."
    legal_basis: "Luật BHXH 2024"
    source_url: "https://xaydungchinhsach.chinhphu.vn/tra-cuu-ty-le-huong-luong-huu-hang-thang-tinh-theo-so-nam-dong-bhxh-tu-1-7-11925040914175139.htm"
    verified: true
  - id: reg_pension_rate_male
    topic: "Tỷ lệ hưởng lương hưu – lao động nam"
    segment: M2
    content_vi: "Đóng từ 15 đến dưới 20 năm: 15 năm ứng với 40%, mỗi năm thêm 1%; 20 năm ứng với 45%; sau đó mỗi năm thêm 2%; tối đa 75%."
    legal_basis: "Luật BHXH 2024"
    source_url: "https://baohiemxahoi.gov.vn/tintuc/Pages/linh-vuc-bao-hiem-xa-hoi.aspx?CateID=168&ItemID=23692"
    verified: partial
    note_vi: "Phần 15–20 năm đã đối chiếu; phần cộng 2% mỗi năm sau 20 năm cần kiểm tra lại."
  - id: reg_pension_bhyt
    topic: "BHYT cho người hưởng lương hưu"
    segment: M2
    content_vi: "Người hưởng lương hưu hằng tháng được hưởng BHYT trong suốt quá trình hưởng lương hưu."
    legal_basis: "Luật BHXH 2024"
    source_url: "https://baohiemxahoi.gov.vn/tintuc/Pages/linh-vuc-bao-hiem-xa-hoi.aspx?CateID=168&ItemID=23692"
    verified: true
  - id: reg_retirement_age
    topic: "Tuổi nghỉ hưu"
    segment: M2
    content_vi: "Theo lộ trình Bộ luật Lao động 2019: nam từ 60 tuổi 3 tháng (năm 2021), tăng 3 tháng mỗi năm đến 62 tuổi (năm 2028); nữ từ 55 tuổi 4 tháng (năm 2021), tăng 4 tháng mỗi năm đến 60 tuổi (năm 2035)."
    legal_basis: "Bộ luật Lao động 2019, Điều 169"
    source_url: "https://xaydungchinhsach.chinhphu.vn/dieu-kien-huong-luong-huu-theo-luat-bao-hiem-xa-hoi-nam-2024-119250923090733775.htm"
    verified: partial
    note_vi: "Lộ trình của nam đã đối chiếu; lộ trình của nữ theo Bộ luật Lao động 2019, cần đối chiếu thêm."
  - id: reg_bhxh_tn_contribution
    topic: "Mức đóng BHXH tự nguyện"
    segment: M2
    content_vi: "Người tham gia đóng theo tỷ lệ 22% mức thu nhập tháng do mình lựa chọn; Nhà nước có hỗ trợ một phần tiền đóng cho một số nhóm."
    legal_basis: "Luật BHXH 2024"
    verified: false
    note_vi: "Tỷ lệ, mức thu nhập tối thiểu làm căn cứ đóng và mức hỗ trợ cần tra cứu văn bản hiện hành."
  - id: reg_bhxh_lump_sum
    topic: "Rút BHXH một lần"
    segment: M2
    content_vi: "Khi đã nhận BHXH một lần, thời gian đóng tương ứng không còn được tính để hưởng lương hưu. Nên cân nhắc kỹ trước khi rút."
    verified: partial
  - id: reg_survivor_allowance
    topic: "Chế độ tử tuất"
    segment: M3
    content_vi: "Thân nhân của người đang hưởng lương hưu khi người đó mất có thể được hưởng trợ cấp tuất (một lần hoặc hằng tháng) nếu đủ điều kiện."
    verified: false
    note_vi: "Điều kiện và mức hưởng cần tra cứu; LUMI chỉ nhắc khách hỏi cơ quan BHXH."
  - id: reg_retirement_insurance_payout
    topic: "Quyền lợi của bảo hiểm hưu trí (nghiệp vụ nhân thọ)"
    segment: M2
    content_vi: "Quyền lợi hưu trí được chi trả định kỳ theo thoả thuận; trong thời gian đóng phí thường có quyền lợi tử vong hoặc thương tật; có thể kèm quyền lợi bổ sung."
    source_url: "https://www.manulife.com.vn/vi/kien-thuc/nhung-thong-tin-huu-ich-ve-quyen-loi-bao-hiem-huu-tri.html"
    verified: partial
    note_vi: "Nguồn là tài liệu của một doanh nghiệp; cần đối chiếu Nghị định 46/2023/NĐ-CP."
  - id: reg_tt67_recording
    topic: "Ghi âm khi tư vấn sản phẩm liên kết đầu tư"
    segment: M2
    content_vi: "Việc tư vấn sản phẩm bảo hiểm liên kết đầu tư phải được ghi âm; tài liệu liên quan lưu tối thiểu 5 năm."
    legal_basis: "Thông tư 67/2023/TT-BTC"
    effective_from: "2023-11-02"
    source_url: "https://xaydungchinhsach.chinhphu.vn/nhung-diem-moi-cua-thong-tu-67-2023-tt-btc-ve-kinh-doanh-bao-hiem-119231112092640447.htm"
    verified: true
  - id: reg_tt67_bank_60days
    topic: "Hạn chế tư vấn qua ngân hàng"
    segment: M2
    content_vi: "Tổ chức tín dụng làm đại lý bảo hiểm không được tư vấn sản phẩm liên kết đầu tư trong vòng 60 ngày trước và sau khi giải ngân khoản vay cho khách."
    legal_basis: "Thông tư 67/2023/TT-BTC"
    source_url: "https://xaydungchinhsach.chinhphu.vn/nhung-diem-moi-cua-thong-tu-67-2023-tt-btc-ve-kinh-doanh-bao-hiem-119231112092640447.htm"
    verified: true
  - id: reg_tt67_waiting_caps
    topic: "Giới hạn thời gian chờ"
    segment: M4
    content_vi: "Thời gian chờ tối đa: 90 ngày với bệnh thông thường, 1 năm với bệnh có sẵn, 270 ngày với thai sản."
    legal_basis: "Thông tư 67/2023/TT-BTC"
    source_url: "https://luatvietnam.vn/bao-hiem/diem-moi-cua-thong-tu-67-2023-tt-btc-ve-kinh-doanh-bao-hiem-563-96146-article.html"
    verified: true
  - id: reg_tt67_buyer_age
    topic: "Tuổi của bên mua bảo hiểm"
    segment: all
    content_vi: "Cá nhân mua bảo hiểm nhân thọ, sức khoẻ tại Việt Nam phải từ đủ 18 tuổi."
    legal_basis: "Thông tư 67/2023/TT-BTC"
    source_url: "https://luatvietnam.vn/bao-hiem/diem-moi-cua-thong-tu-67-2023-tt-btc-ve-kinh-doanh-bao-hiem-563-96146-article.html"
    verified: true
  - id: reg_free_look
    topic: "Thời gian cân nhắc"
    segment: all
    content_vi: "Hợp đồng bảo hiểm nhân thọ và sức khoẻ dài hạn thường có thời gian cân nhắc (khoảng 21 ngày) để khách đọc lại và có thể huỷ hợp đồng theo quy định."
    verified: false
    note_vi: "Kiểm tra số ngày và điều kiện hoàn phí trong quy tắc điều khoản của từng sản phẩm."
  - id: reg_microinsurance
    topic: "Bảo hiểm vi mô"
    segment: all
    content_vi: "Bảo hiểm vi mô dành cho cá nhân, hộ gia đình có thu nhập thấp, bảo vệ trước rủi ro về tính mạng, sức khoẻ, tài sản."
    legal_basis: "Luật 08/2022/QH15"
    source_url: "https://xaydungchinhsach.chinhphu.vn/toan-van-luat-kinh-doanh-bao-hiem-119240130070753445.htm"
    verified: true
  - id: reg_job_loss_market
    topic: "Thực tế thị trường bảo hiểm mất việc"
    segment: M1
    content_vi: "Quyền lợi mất việc thương mại thường gắn với khoản vay, thẻ tín dụng hoặc gói đi kèm dịch vụ ngân hàng. Ví dụ năm 2025 có gói đi kèm dịch vụ trả lương chi trả khi người lao động mất việc do doanh nghiệp phá sản hoặc cắt giảm nhân sự."
