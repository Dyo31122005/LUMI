# ---------------------------------------------------------------------
# 2. INSURANCE TYPES – 4 loại bảo hiểm LUMI tư vấn
# ---------------------------------------------------------------------
insurance_types:
  - id: unemployment
    segment: M1
    name_vi: "Bảo hiểm thất nghiệp / bảo vệ thu nhập khi mất việc"
    short_vi: "Thất nghiệp"
    purpose_vi: "Giữ một phần thu nhập hoặc trả thay khoản nợ khi khách mất việc không tự nguyện."
    legal_category: ["state_scheme", "non_life", "health"]
    market_note_vi: >-
      Bảo hiểm mất việc bán lẻ độc lập cho cá nhân rất hiếm ở Việt Nam. Quyền lợi mất việc thường gắn
      với khoản vay, thẻ tín dụng hoặc gói đi kèm dịch vụ ngân hàng. Sản phẩm độc lập trong catalog là hư cấu.
    product_lines:
      - "BHTN bắt buộc (Nhà nước)"
      - "Bảo hiểm khoản vay / thẻ tín dụng có quyền lợi mất việc"
      - "Gói bảo hiểm đi kèm dịch vụ tài chính có quyền lợi mất việc"
      - "Bảo hiểm tai nạn có quyền lợi mất thu nhập"
    need_signals_vi:
      - "Đang tìm việc, đang thử việc hoặc mới đi làm dưới 12 tháng"
      - "Số tháng đã đóng BHTN dưới 12"
      - "Có khoản trả góp hoặc khoản vay hằng tháng"
      - "Thu nhập bấp bênh"
      - "Nói ra nỗi lo mất việc, bị cắt giảm, không có tiền trang trải"
    not_prioritized_when_vi:
      - "Trên 55 tuổi hoặc sắp nghỉ hưu"
      - "Đã đóng BHTN đủ lâu và có quỹ dự phòng từ 6 tháng chi tiêu trở lên"
    discovery_topics: ["job_income", "debts_expenses", "social_insurance", "budget_payment"]
    decision_criterion: >-
      Protects income after involuntary job loss; fits people who are job seeking, on probation or newly
      employed, have fewer than 12 months of unemployment insurance contributions, have monthly loan
      repayments, or worry about losing their job
  - id: retirement
    segment: M2
    name_vi: "Bảo hiểm hưu trí"
    short_vi: "Hưu trí"
    purpose_vi: "Tích luỹ dài hạn để có thu nhập đều đặn sau khi nghỉ hưu."
    legal_category: ["state_scheme", "life"]
    market_note_vi: >-
      Lớp nền là BHXH (bắt buộc hoặc tự nguyện). Lớp bổ sung gồm bảo hiểm hưu trí (nghiệp vụ nhân thọ)
      và các sản phẩm nhân thọ tích luỹ. Cần phân biệt phần cam kết và phần minh hoạ.
    product_lines:
      - "BHXH tự nguyện (Nhà nước)"
      - "Bảo hiểm hưu trí (cá nhân hoặc nhóm)"
      - "Nhân thọ tích luỹ: hỗn hợp, liên kết chung, liên kết đơn vị"
    need_signals_vi:
      - "Tuổi 35–55, còn 5–25 năm đến tuổi nghỉ hưu"
      - "Số năm BHXH dự kiến đến tuổi hưu dưới 15, hoặc tự kinh doanh không đóng BHXH"
      - "Nói ra nỗi lo về già, lương hưu, không muốn phụ thuộc con"
    not_prioritized_when_vi:
      - "Dưới 28 tuổi và thu nhập chưa ổn định"
      - "Đã có từ 20 năm BHXH và còn dưới 3 năm đến tuổi hưu"
    discovery_topics: ["social_insurance", "job_income", "risk_attitude", "debts_expenses", "budget_payment"]
    decision_criterion: >-
      Builds savings for a regular income after retirement; fits people who are 5 to 25 years from
      retirement age, have a pension gap because they have fewer than 15 years of social insurance or are
      self-employed, and worry about income in old age
  - id: life
    segment: M3
    name_vi: "Bảo hiểm nhân thọ (bảo vệ, để lại tài sản)"
    short_vi: "Nhân thọ"
    purpose_vi: "Chi trả một khoản cho người thụ hưởng khi người được bảo hiểm mất, có thể kèm tích luỹ."
    legal_category: ["life"]
    market_note_vi: >-
      Với khách lớn tuổi cần chú ý tuổi tham gia tối đa, thẩm định sức khoẻ và tổng phí so với số tiền
      bảo hiểm. Cách xử lý bệnh mãn tính thường không công khai.
    product_lines: ["Tử kỳ", "Trọn đời", "Trọn đời đóng phí một lần", "Hỗn hợp", "Liên kết chung", "Sản phẩm bổ trợ"]
    need_signals_vi:
      - "Có người phụ thuộc tài chính (vợ/chồng không thu nhập, con dưới 18, cha mẹ)"
      - "Nói ra mong muốn để lại cho vợ/con/cháu, không muốn con cái gánh"
      - "Có tài sản tích luỹ, chưa có bảo hiểm nhân thọ"
    not_prioritized_when_vi:
      - "Dưới 25 tuổi và không có người phụ thuộc"
      - "Trên 70 tuổi (ngoài tuổi tham gia của đa số sản phẩm)"
    discovery_topics: ["dependents_family", "goals_concerns", "health", "beneficiaries", "budget_payment"]
    decision_criterion: >-
      Pays a sum to beneficiaries when the insured person dies; fits people with financial dependents such
      as a spouse without income or young children, people who want to leave money to family, and people
      with savings who have no life insurance yet
  - id: health
    segment: M4
    name_vi: "Bảo hiểm sức khoẻ và tai nạn"
    short_vi: "Sức khoẻ"
    purpose_vi: "Chi trả chi phí y tế, bệnh hiểm nghèo, nằm viện hoặc tai nạn."
    legal_category: ["state_scheme", "health"]
    market_note_vi: "Trong demo, loại này chủ yếu dùng làm loại phụ hoặc quyền lợi bổ trợ."
    product_lines: ["BHYT (Nhà nước)", "Chăm sóc sức khoẻ", "Bệnh hiểm nghèo", "Tai nạn con người"]
    need_signals_vi:
      - "Có bệnh mãn tính"
      - "Nói ra nỗi lo chi phí khám chữa bệnh"
      - "Chưa có bảo hiểm sức khoẻ thương mại"
      - "Từ 50 tuổi trở lên"
    not_prioritized_when_vi:
      - "Khách nói rõ chi phí y tế không phải nỗi lo chính và đã có BHYT"
    discovery_topics: ["health", "goals_concerns", "budget_payment"]
    decision_criterion: >-
      Pays medical, hospital or accident costs; fits people whose main worry is medical expenses, people
      with a chronic illness, and people over 50 without private health cover

# ---------------------------------------------------------------------
# 3. DECISION QUESTIONS – các quyết định của A2 Decision Agent (OpenAI Structured Outputs; tương thích Decision Agent)
#    Câu hỏi và tiêu chí viết bằng tiếng Anh, dạng khẳng định.
#    State gửi vào chỉ gồm các trường cần thiết (A1 đã chuẩn hoá).
# ---------------------------------------------------------------------
decision_questions:
  engine:
    default: openai
    model: "gpt-5.6-luna"
    reasoning_effort: { per_turn: "low", step1_final_type: "medium", product_scoring: "low", flags: "low" }
    output_vi: "Structured Outputs, JSON schema strict: lựa chọn là enum, xác suất là các trường số có tên cố định, kèm confidence và reason ngắn"
    batching_vi: "D1–D4 gộp vào 1 lời gọi mỗi lượt; D5 gọi riêng từng sản phẩm, chạy song song"
    probability_note_vi: "Xác suất do mô hình tự ước lượng, không được hiệu chỉnh; giao diện ghi 'ước lượng'; code chuẩn hoá tổng bằng 1"
    alternatives: { offline: "rule", future: "jev" }
  D1:
    name_vi: "Chủ đề hỏi tiếp"
    type: choice
    instructions: "Which topic the advisor should ask about next to understand this customer's insurance needs"
    state_fields: ["known_profile", "missing_fields", "type_probabilities"]
    options:
      job_income: "Employment status, job prospects and income stability are still unknown"
      dependents_family: "Family members and financial dependents are still unknown"
      debts_expenses: "Monthly expenses, loans or upcoming large expenses are still unknown"
      social_insurance: "Social insurance and unemployment insurance contribution history is still unknown"
      health: "Health conditions and smoking status are still unknown and matter for life or health insurance"
      goals_concerns: "The customer's main worry or financial goal is still unclear"
      risk_attitude: "The customer's attitude to investment risk is unknown and matters for retirement products"
      beneficiaries: "Who should receive the money is unknown and matters for life insurance"
      budget_payment: "Budget and preferred payment method are still unknown"
      existing_coverage: "Existing insurance policies other than public health insurance are still unknown"
      ready_to_recommend: "Enough information is known to recommend an insurance type"
    confidence_min: 0.5
    fallback_order: ["goals_concerns", "job_income", "dependents_family", "debts_expenses", "social_insurance", "health", "risk_attitude", "existing_coverage", "beneficiaries", "budget_payment", "ready_to_recommend"]
    ui_explanation_template_vi: "Vì sao LUMI hỏi câu này: cần làm rõ «{topic_vi}», giả thuyết đang dẫn đầu là «{top_type_vi}» ({top_prob}%)."
    topic_labels_vi:
      job_income: "công việc và thu nhập"
      dependents_family: "gia đình và người phụ thuộc"
      debts_expenses: "chi tiêu và khoản nợ"
      social_insurance: "quá trình đóng BHXH/BHTN"
      health: "sức khoẻ"
      goals_concerns: "nỗi lo và mong muốn"
      risk_attitude: "khẩu vị rủi ro"
      beneficiaries: "người thụ hưởng"
      budget_payment: "ngân sách và cách đóng phí"
      existing_coverage: "bảo hiểm đang có"
      ready_to_recommend: "đủ thông tin để đề xuất"
  D2:
    name_vi: "Thái độ của khách"
    type: score_group
    state_fields: ["relevant_quotes"]
    questions:
      risk_tolerance:
        instructions: "How much investment risk the customer is willing to accept"
        levels: ["Very low", "Low", "Medium", "High"]
      need_flexibility:
        instructions: "How much the customer needs to pause, reduce or withdraw payments in the next few years"
        levels: ["Low", "Medium", "High"]
      trust_concern:
        instructions: "How worried the customer is that the insurer will not pay claims"
        levels: ["Low", "Medium", "High"]
  D3:
    name_vi: "Loại bảo hiểm (Bước 1 và thanh giả thuyết)"
    type: choice
    instructions: "Which insurance type best addresses this customer's main financial risk right now"
    state_fields: ["full_profile", "derived_fields"]
    options_from: "insurance_types[].decision_criterion"
    run_every_turn: true
    confidence_min: 0.6
    secondary_prob_min: 0.2
    cross_check_vi: "So sánh với luật chấm điểm của bản thiết kế v0.1; nếu khác nhau thì hiển thị cả hai và hỏi thêm 1 câu."
  D4:
    name_vi: "Ý định của khách"
    type: choice
    instructions: "What the customer wants to do next"
    state_fields: ["last_bot_message", "last_customer_message"]
    options:
      agree_continue: "The customer agrees to see the comparison or to continue"
      ask_question: "The customer asks a question"
      add_or_correct_info: "The customer adds new information or corrects earlier information"
      end_conversation: "The customer wants to stop now or decide later"
    confidence_min: 0.6
  D5:
    name_vi: "Mức phù hợp của sản phẩm theo 6 tiêu chí"
    type: score_group_per_product
    state_fields: ["profile_summary", "one_product"]
    levels: ["Does not meet", "Partly meets", "Meets well", "Meets very well"]
    questions_from: "scoring.criteria[].decision_instruction"
    note_vi: "Gọi riêng cho từng sản phẩm, chạy song song. Điểm tổng tính bằng code."
  D6:
    name_vi: "Cờ nhận định (tuỳ chọn)"
    type: noul_group
    state_fields: ["full_profile", "derived_fields"]
    threshold: 0.7
    flags:
      large_expense_2y:
        instructions: "The customer has a large planned expense within the next two years"
        insight_template_vi: "Khách có khoản chi lớn sắp tới: nên ưu tiên sản phẩm cho tạm dừng hoặc rút linh hoạt."
      dependent_without_income:
        instructions: "A family member depends financially on the customer and has no income of their own"
        insight_template_vi: "Nếu khách mất, người phụ thuộc sẽ mất nguồn thu nhập."
      pension_gap:
        instructions: "The customer will reach retirement age with fewer than 15 years of social insurance unless they keep contributing"
        insight_template_vi: "Còn thiếu {missing_years} năm để đủ 15 năm đóng BHXH."
      first_year_unemployment_gap:
        instructions: "The customer has fewer than 12 months of unemployment insurance contributions"
        insight_template_vi: "Nếu mất việc trong 12 tháng đầu, BHTN Nhà nước chưa chi trả."
      chronic_condition:
        instructions: "The customer has a chronic health condition that needs regular treatment"
        insight_template_vi: "Có bệnh mãn tính: nên ưu tiên sản phẩm thẩm định đơn giản và phải khai báo trung thực."

# ---------------------------------------------------------------------
# 4. SCORING – tiêu chí, trọng số, ngưỡng (code dùng)
# ---------------------------------------------------------------------
scoring:
  criteria:
    - id: C1
      name_vi: "Đáp ứng nhu cầu chính"
      decision_instruction: "How well this product addresses the customer's main worry"
    - id: C2
      name_vi: "Khả năng chi trả"
      decision_instruction: "How affordable this product is given the customer's budget and income, including all fees"
    - id: C3
      name_vi: "Mức cam kết, an toàn"
      decision_instruction: "How much of this product's benefit is guaranteed rather than dependent on market returns"
    - id: C4
      name_vi: "Linh hoạt"
      decision_instruction: "How well this product lets the customer pause, reduce, withdraw or cancel when the customer needs to"
    - id: C5
      name_vi: "Điều kiện tham gia"
      decision_instruction: "How easily this customer can qualify for this product given age, health, employment and waiting periods"
    - id: C6
      name_vi: "Uy tín và bồi thường"
      decision_instruction: "How clear, fast and reliable this product's claim or payout process is"
  base_weights:
    unemployment: { C1: 25, C2: 30, C3: 5,  C4: 15, C5: 20, C6: 5 }
    retirement:   { C1: 20, C2: 15, C3: 25, C4: 15, C5: 5,  C6: 20 }
    life:         { C1: 30, C2: 20, C3: 15, C4: 10, C5: 15, C6: 10 }
    health:       { C1: 30, C2: 20, C3: 10, C4: 10, C5: 20, C6: 10 }
  adjustments:
    - { when: "income_stability == 'low' or premium_to_income_ratio > 0.05", add: { C2: 10 }, reason_vi: "Thu nhập bấp bênh hoặc ngân sách hạn chế" }
    - { when: "risk_tolerance in ['Very low', 'Low']", add: { C3: 10 }, reason_vi: "Khách không muốn rủi ro" }
    - { when: "need_flexibility == 'High' or has_large_expense_2y", add: { C4: 10 }, reason_vi: "Có thể cần tạm dừng hoặc rút tiền" }
    - { when: "has_chronic_condition", add: { C5: 10 }, reason_vi: "Có bệnh mãn tính, thẩm định là rào cản" }
    - { when: "trust_concern == 'High'", add: { C6: 10 }, reason_vi: "Khách lo không được chi trả" }
  normalize_to: 100
  level_to_points: { "Does not meet": 0, "Partly meets": 4, "Meets well": 7, "Meets very well": 10 }
  fit_score: "sum(weight_i * points_i) / 10   # thang 0–100"
  cell_tone: { "Does not meet": bad, "Partly meets": warn, "Meets well": good, "Meets very well": good }
  priority_criteria_count: 2
  thresholds:
    completeness_min: 0.85
    max_discovery_questions: 8
    type_confidence_min: 0.6
    secondary_type_prob_min: 0.2
  criterion_to_rows:
    unemployment:
      C1: ["Mức chi trả", "Tổng quyền lợi tối đa", "Sự kiện được chi trả"]
      C2: ["Phí"]
      C3: ["Loại trừ chính"]
      C4: ["Linh hoạt"]
